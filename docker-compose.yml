version: "3.9"

# ─────────────────────────────────────────────
#  GhostTrace — Enterprise Stack Orchestration
#  Intelligence Beyond Visibility
# ─────────────────────────────────────────────

networks:
  ghosttrace-net:
    driver: bridge

volumes:
  ghosttrace-mongo-data:
  ghosttrace-redis-data:

services:

  # ── MongoDB — Persistent Intelligence Store ───────────────────────
  ghosttrace-db:
    image: mongo:7.0
    container_name: ghosttrace-db
    restart: unless-stopped
    networks:
      - ghosttrace-net
    volumes:
      - ghosttrace-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ghosttrace
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis — Caching, Rate Limiting & Queue Broker ─────────────────
  ghosttrace-cache:
    image: redis:7.2-alpine
    container_name: ghosttrace-cache
    restart: unless-stopped
    networks:
      - ghosttrace-net
    volumes:
      - ghosttrace-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI — Cybersecurity Intelligence API ──────────────────────
  ghosttrace-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghosttrace-api
    restart: unless-stopped
    networks:
      - ghosttrace-net
    depends_on:
      ghosttrace-db:
        condition: service_healthy
      ghosttrace-cache:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://ghosttrace-db:27017/ghosttrace
      - REDIS_URL=redis://ghosttrace-cache:6379/0
      - APP_ENV=production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Vite React — Frontend Intelligence Dashboard ──────────────────
  ghosttrace-ui:
    image: node:20-alpine
    container_name: ghosttrace-ui
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - VITE_API_BASE=http://ghosttrace-api:8000
    ports:
      - "5173:5173"
    networks:
      - ghosttrace-net
    depends_on:
      - ghosttrace-api
